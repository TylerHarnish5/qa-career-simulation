{% extends 'base.html' %}
{% block title %}Sign in · Harbor & Pine{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">Customer account</p><h1>Welcome back</h1><p>Sign in to place an order and view your purchase history.</p>
  <form method="post" class="stack-form">
    <label>Username<input name="username" autocomplete="username" required value="{{ request.form.get('username', '') }}"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="button primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
